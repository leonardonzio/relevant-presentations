name: Build Typst document
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Typst
        uses: typst-community/setup-typst@v5

      - name: Compile all Typst files in their folders
        run: |
          for file in */*.typ; do
            typst compile --creation-timestamp "$(git log -1 --format=%ct "$file")" "$file"
          done

      - name: Save PDFs into the same folders
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: compile Typst PDFs [skip ci]"
          file_pattern: "*/*.pdf"
